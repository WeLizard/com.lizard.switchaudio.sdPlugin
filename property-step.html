<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volume step</title><style>body{background:#2d2d2d;color:#eee;font:12px "Segoe UI",sans-serif;padding:8px;margin:0}input{width:70px;padding:5px;background:#202020;color:#fff;border:1px solid #666;border-radius:4px}label{display:flex;align-items:center;gap:8px}p{color:#aaa;max-width:350px}</style></head><body><label><span id="label">Volume step, %</span><input id="step" type="number" min="1" max="100" value="5"></label><p id="hint">Change the default playback device by this percentage.</p><script src="plugin/settings.js"></script><script>
let socket,uuid,settings={};const step=document.getElementById('step');
function connectElgatoStreamDeckSocket(port,id,event,info,actionInfo){uuid=id;settings=JSON.parse(actionInfo).payload.settings||{};const language=JSON.parse(info).application?.language||'en';if(language.startsWith('ru')){document.getElementById('label').textContent='Шаг громкости, %';document.getElementById('hint').textContent='Изменение громкости текущего устройства воспроизведения.';}else if(language.startsWith('zh')){document.getElementById('label').textContent='音量步长，%';document.getElementById('hint').textContent='调节默认播放设备的音量。';}step.value=AudioSettings.volumeStep(settings);socket=new WebSocket('ws://127.0.0.1:'+port);socket.onopen=()=>socket.send(JSON.stringify({event,uuid}));socket.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.event==='didReceiveSettings'){settings=d.payload.settings||{};step.value=AudioSettings.volumeStep(settings);}}catch{}};}
step.onchange=()=>{settings.volumeStepPercent=AudioSettings.number(step.value,5,1,100);step.value=settings.volumeStepPercent;if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify({event:'setSettings',context:uuid,payload:settings}));};
</script></body></html>
