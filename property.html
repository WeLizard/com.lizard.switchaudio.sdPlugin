<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Audio Switch Pro</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:8px;font:12px/1.4 "Segoe UI",sans-serif;background:#2d2d2d;color:#eee;min-width:250px}main{max-width:580px}select,input,button{font:inherit;color:inherit;background:#202020;border:1px solid #555;border-radius:4px;min-height:28px}select,input{padding:3px 6px;min-width:0}button{cursor:pointer;padding:3px 8px}button:hover{background:#444}button:disabled{opacity:.4;cursor:default}:focus-visible{outline:2px solid #62c5ec;outline-offset:1px}.toolbar,.options{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}.toolbar label{display:flex;align-items:center;gap:5px}.toolbar select{max-width:230px}.device{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:5px;border-top:1px solid #444;padding:7px 0}.order{align-self:center;text-align:center;color:#82d4ed}.details{display:flex;gap:5px;grid-column:2 / 4}.details input{flex:1;max-width:240px}.details select{flex:1;min-width:120px;max-width:240px}.details{align-items:center;flex-wrap:wrap}.details input{flex:1 1 100px;max-width:220px}.icon-preview{width:36px;height:36px;position:relative;flex-shrink:0}.icon-preview img{display:block;width:36px;height:36px}.preview-number{position:absolute;left:50%;top:83.333%;transform:translate(-50%,-50%);width:6px;height:6px;border-radius:50%;font:bold 4px/6px Arial;text-align:center}.preview-number.hidden{display:none}.details label{display:flex;flex:1 1 170px;align-items:center;gap:6px;min-width:0}.device{grid-template-columns:20px minmax(0,1fr) auto}.device>select{width:100%;min-width:0}.row-name{max-width:210px}.options{margin-top:7px}.actions{display:flex;gap:3px}.actions button{min-width:27px;padding:2px 5px}.options label{display:flex;gap:4px;align-items:center}input[type=checkbox]{min-height:auto}#status{font-size:11px;color:#bbb;white-space:pre-wrap;overflow-wrap:anywhere;margin:5px 0}#status.error{color:#ffb6ad}#empty{color:#aaa}small{display:block;color:#aaa;margin-top:5px}h1{font-size:12px;margin:3px 0 8px}#rows{max-height:360px;overflow-y:auto}details{margin-top:8px}summary{cursor:pointer}details .toolbar{margin-top:6px}
[hidden]{display:none!important}.live-state{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:8px;border-top:1px solid #444;max-width:540px}.live-state>div{min-width:0}.live-state img{flex:none}.live-state small{margin:3px 0}.live-state div div{font-size:11px;color:#bcc9d4}#indicator-help{overflow-wrap:anywhere}#highlight-option.disabled{opacity:.5}
</style></head><body><main>
<h1>Audio Switch Pro · 2.0.0</h1>
<div class="toolbar"><label><span data-t="type">Device</span><select id="type"><option value="output" data-t="output">Output</option><option value="input" data-t="input">Input</option></select></label><label><span data-t="mode">Mode</span><select id="mode"><option value="cycle" data-t="cycle">Cycle through the list</option><option value="selected" data-t="selected">Select the first device</option></select></label></div>
<div id="rows"></div><p id="empty" data-t="empty">Add the devices in the desired switching order.</p>
<div class="toolbar"><button id="add" data-t="add">+ Device</button><button id="refresh" data-t="refresh">Refresh</button></div>
<details><summary data-t="options">Options</summary><div class="toolbar"><label><span data-t="roles">Change</span><select id="roles"><option value="all" data-t="all">All default roles</option><option value="media" data-t="media">Playback / recording only</option><option value="communications" data-t="communications">Communications only</option></select></label><label><span data-t="direction">Direction</span><select id="direction"><option value="next" data-t="next">Forward</option><option value="previous" data-t="previous">Backward</option></select></label></div><div class="options"><label><input type="checkbox" id="skip"><span data-t="skip">Skip disconnected devices</span></label><label id="highlight-option"><input type="checkbox" id="highlight"><span data-t="highlight">Highlight selected device</span></label></div><div class="toolbar"><label><span data-t="badgeMode">Number</span><select id="badge-mode"><option value="auto" data-t="badgeAuto">From list</option><option value="custom" data-t="badgeCustom">Custom number</option><option value="off" data-t="badgeOff">Hidden</option></select></label><label id="custom-option"><span data-t="customNumber">Value</span><input type="number" id="custom-number" min="1" max="32" step="1" value="1" style="width:62px"></label></div><small data-t="highlightHint">Highlight follows the actual Windows defaults for the chosen roles.</small></details>
<section class="live-state"><img id="key-preview" width="56" height="56" alt=""><div><strong id="indicator-state"></strong><div id="indicator-roles"></div><small id="indicator-help"></small></div></section>

<p id="status" role="status" aria-live="polite"></p>
</main><script src="plugin/device-catalog.js"></script><script src="plugin/settings.js"></script><script src="property.js"></script></body></html>
