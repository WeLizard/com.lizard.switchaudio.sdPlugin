<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Audio Switch Pro</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:8px;font:12px/1.4 "Segoe UI",sans-serif;background:#2d2d2d;color:#eee;min-width:250px}main{max-width:580px}select,input,button{font:inherit;color:inherit;background:#202020;border:1px solid #555;border-radius:4px;min-height:28px}select,input{padding:3px 6px;min-width:0}button{cursor:pointer;padding:3px 8px}button:hover{background:#444}button:disabled{opacity:.4;cursor:default}:focus-visible{outline:2px solid #62c5ec;outline-offset:1px}.toolbar,.options{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}.toolbar label{display:flex;align-items:center;gap:5px}.toolbar select{max-width:230px}.device{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:5px;border-top:1px solid #444;padding:7px 0}.order{align-self:center;text-align:center;color:#82d4ed}.details{display:flex;gap:5px;grid-column:2 / 4}.details input{flex:1;max-width:240px}.details select{max-width:145px}.actions{display:flex;gap:3px}.actions button{min-width:27px;padding:2px 5px}.options label{display:flex;gap:4px;align-items:center}input[type=checkbox]{min-height:auto}#status{font-size:11px;color:#bbb;white-space:pre-wrap;overflow-wrap:anywhere;margin:5px 0}#status.error{color:#ffb6ad}#empty{color:#aaa}small{display:block;color:#aaa;margin-top:5px}h1{font-size:12px;margin:3px 0 8px}#rows{max-height:360px;overflow-y:auto}details{margin-top:8px}summary{cursor:pointer}details .toolbar{margin-top:6px}
</style></head><body><main>
<h1>Audio Switch Pro · 1.4</h1>
<div class="toolbar"><label><span data-t="type">Device</span><select id="type"><option value="output" data-t="output">Output</option><option value="input" data-t="input">Input</option></select></label><label><span data-t="mode">Mode</span><select id="mode"><option value="cycle" data-t="cycle">Cycle through the list</option><option value="selected" data-t="selected">Select the first device</option></select></label></div>
<div id="rows"></div><p id="empty" data-t="empty">Add the devices in the desired switching order.</p>
<div class="toolbar"><button id="add" data-t="add">+ Device</button><button id="refresh" data-t="refresh">Refresh</button></div>
<details><summary data-t="options">Options</summary><div class="toolbar"><label><span data-t="roles">Change</span><select id="roles"><option value="all" data-t="all">All default roles</option><option value="media" data-t="media">Playback / recording only</option><option value="communications" data-t="communications">Communications only</option></select></label><label><span data-t="direction">Direction</span><select id="direction"><option value="next" data-t="next">Forward</option><option value="previous" data-t="previous">Backward</option></select></label></div><div class="options"><label><input type="checkbox" id="skip"><span data-t="skip">Skip disconnected devices</span></label><label><input type="checkbox" id="title"><span data-t="title">Show device name on key</span></label></div></details>
<p id="status" role="status" aria-live="polite"></p><small data-t="hint">The key follows the actual Windows default. Applications pinned to a device may ignore a default change.</small>
</main><script src="plugin/settings.js"></script><script src="property.js"></script></body></html>
