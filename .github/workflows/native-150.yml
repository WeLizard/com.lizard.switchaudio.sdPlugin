name: Native audio observer 1.5
on:
  push:
    branches: [main, 'astra/**', 'feature/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-audio-150-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile native sources and run read-only Windows tests
        run: python tools/build-native.py
      - name: Upload native binary, sources and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AudioSwitch-native
          path: build/
          if-no-files-found: error
          retention-days: 14
