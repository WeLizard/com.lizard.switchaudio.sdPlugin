<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media launch</title><style>body{background:#2d2d2d;color:#eee;font:12px/1.4 "Segoe UI",sans-serif;padding:8px;margin:0}main{max-width:580px}label{display:block;margin:5px 0}input{width:100%;max-width:460px;display:block;padding:5px;background:#202020;color:#fff;border:1px solid #666;border-radius:4px}small{display:block;color:#bbb;max-width:460px}</style></head><body><main><label><span id="pathLabel">Application path or URI (optional)</span><input id="path" placeholder="C:\Program Files\Player\player.exe"></label><label><span id="processLabel">Process name</span><input id="process" placeholder="player.exe"></label><small id="hint">Paste the full Windows path. For shortcuts or URIs, specify the running process name. Play/Pause sends a media key; it is not playback status.</small></main><script>
let socket,uuid,settings={};const pathField=document.getElementById('path'),processField=document.getElementById('process');
function render(){pathField.value=settings.appPath||'';processField.value=settings.processName||'';}
function connectElgatoStreamDeckSocket(port,id,event,info,actionInfo){uuid=id;settings=JSON.parse(actionInfo).payload.settings||{};const lang=JSON.parse(info).application?.language||'en';if(lang.startsWith('ru')){document.getElementById('pathLabel').textContent='Путь к программе или URI (необязательно)';document.getElementById('processLabel').textContent='Имя процесса';document.getElementById('hint').textContent='Вставь полный путь Windows. Для ярлыка или URI укажи реальное имя процесса. Play/Pause отправляет медиа-клавишу, но не отображает состояние плеера.';}else if(lang.startsWith('zh')){document.getElementById('pathLabel').textContent='应用路径或 URI（可选）';document.getElementById('processLabel').textContent='进程名称';document.getElementById('hint').textContent='输入完整路径。快捷方式或 URI 必须指定进程名称。播放按键不表示实时播放状态。';}render();socket=new WebSocket('ws://127.0.0.1:'+port);socket.onopen=()=>socket.send(JSON.stringify({event,uuid}));socket.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.event==='didReceiveSettings'){settings=d.payload.settings||{};render();}}catch{}};}
function save(){settings.appPath=pathField.value.trim();settings.processName=processField.value.trim();if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify({event:'setSettings',context:uuid,payload:settings}));}
pathField.onchange=save;processField.onchange=save;
</script></body></html>
